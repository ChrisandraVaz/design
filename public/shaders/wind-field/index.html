<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wind field</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080e04; }
    canvas { display: block; width: 100vw; height: 100vh; }
    @supports (height: 100dvh) {
      canvas { height: 100dvh; }
    }
  </style>
</head>
<body>
  <canvas id="field" role="img" aria-label="An overhead view of a lush green field, with gently wind-swept grass and four small people in sun hats."></canvas>
  <script src="field.js?v=centered-people-26"></script>
</body>
</html>
