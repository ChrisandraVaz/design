<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>25 Merch Grids · Chrisandra Vaz</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#222;background:#f8f8f8;color-scheme:light;--line:#ddd;--surface:#fff;--muted:#777;--frame:#f3f3f3;--face:#fff;--frameline:#dedee2}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #7d53f5;outline-offset:4px}
header{max-width:1500px;margin:0 auto;padding:40px 32px 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{font-size:12px;color:var(--muted);margin:0 0 12px;letter-spacing:.04em}
h1{font-size:clamp(24px,3vw,36px);font-weight:500;letter-spacing:-1px;margin:0 0 12px}
header p{font-size:14px;color:var(--muted);line-height:1.55;margin:0;max-width:620px}
.controls{display:flex;align-items:center;gap:10px}
.swap{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:24px;min-height:46px;padding:0 16px;font-size:12px}
.swap:hover{border-color:#aaa}
.themes{display:flex;border:1px solid var(--line);padding:3px;border-radius:24px}
.themes button{border:0;border-radius:20px;min-height:40px;padding:0 14px;background:transparent;color:var(--muted);font-size:12px}
.themes button[aria-pressed=true]{background:var(--surface);color:inherit;box-shadow:0 1px 3px #0001}
main{max-width:1500px;margin:0 auto;padding:0 32px 72px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:26px}
.option{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.option:hover{border-color:#aaa}
.stage{padding:22px;display:flex;justify-content:center;background:var(--surface)}
/* The card chrome mirrors the real canvas cover card. */
.card{width:100%;max-width:392px;background:var(--frame);border-radius:20px;padding:6.5px;outline:1px solid var(--frameline);outline-offset:-1px}
.grid{display:grid}
.tile{overflow:hidden;border-radius:14px;background:var(--face);margin:0}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.copy{padding:16px 18px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:20px}
h2{margin:0;font-size:14px;font-weight:500}
.note{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.5}
body[data-theme=dark]{color:#e9e9eb;background:#101010;--line:#303030;--surface:#161616;--muted:#999;--frame:#101010;--face:#171717;--frameline:#343437}
body[data-theme=dark] .themes button[aria-pressed=true]{background:#333}
@media(max-width:700px){header,main{padding-left:18px;padding-right:18px}}
</style>
</head>
<body data-theme="light">
<header>
  <div>
    <p class="eyebrow">FIGMA FOR EDU / MERCH CARD</p>
    <h1>25 ways to lay out one big and two small</h1>
    <p>Every option uses the Apple&nbsp;Watch card's structure &mdash; one hero tile plus two supporting ones &mdash; at the real card width, frame inset and corner radius. Pick a number and I'll wire it into the canvas.</p>
  </div>
  <div class="controls">
    <button id="swap" class="swap">Photos</button>
    <div class="themes" aria-label="Preview colour theme">
      <button data-choice="light" aria-pressed="true">Light</button>
      <button data-choice="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>
<main id="grid"></main>
<script type="module">
const P = '/assets/figma-edu/';
/* big / a / b are grid-area values: row-start / col-start / row-end / col-end */
const layouts = [
  {name:'Watch classic', note:'The Apple Watch card exactly: hero spans both rows on the left.', c:'1.08fr 1fr', r:'150px 96px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Mirrored', note:'Hero on the right, supports stacked left.', c:'1fr 1.08fr', r:'150px 96px', big:'1/2/3/3', a:'1/1/2/2', b:'2/1/3/2'},
  {name:'Hero banner', note:'Wide hero across the top, two equal tiles beneath.', c:'1fr 1fr', r:'168px 120px', big:'1/1/2/3', a:'2/1/3/2', b:'2/2/3/3'},
  {name:'Hero footer', note:'Supports lead, hero anchors the bottom.', c:'1fr 1fr', r:'120px 168px', big:'2/1/3/3', a:'1/1/2/2', b:'1/2/2/3'},
  {name:'Wide hero', note:'Hero takes three fifths; supports stay narrow.', c:'1.5fr 1fr', r:'150px 96px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Narrow hero', note:'Hero yields width so the supports can breathe.', c:'.82fr 1fr', r:'150px 96px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Top-heavy stack', note:'Upper support gets the room.', c:'1.08fr 1fr', r:'156px 90px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Bottom-heavy stack', note:'Lower support gets the room.', c:'1.08fr 1fr', r:'90px 156px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Two-thirds rail', note:'Three rows: one support runs long, one caps it.', c:'1.15fr 1fr', r:'82px 82px 82px', big:'1/1/4/2', a:'1/2/3/3', b:'3/2/4/3'},
  {name:'Thirds, hero doubled', note:'Hero covers two of three columns.', c:'1fr 1fr 1fr', r:'132px 110px', big:'1/1/2/3', a:'2/1/3/3', b:'1/3/3/4'},
  {name:'Centre stage', note:'Hero in the middle, a support either side.', c:'1fr 1.5fr 1fr', r:'246px', big:'1/2/2/3', a:'1/1/2/2', b:'1/3/2/4'},
  {name:'Tall hero, low shelf', note:'Hero owns most of the height.', c:'1fr 1fr', r:'186px 84px', big:'1/1/2/3', a:'2/1/3/2', b:'2/2/3/3'},
  {name:'Square hero, thin rail', note:'Square hero with a slim column of supports.', c:'1.9fr 1fr', r:'124px 124px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Rail left', note:'Supports form a left rail against a right hero.', c:'1fr 1.9fr', r:'124px 124px', big:'1/2/3/3', a:'1/1/2/2', b:'2/1/3/2'},
  {name:'L-shape', note:'Hero top-left, one tall right, one wide beneath.', c:'1.3fr 1fr', r:'150px 96px', big:'1/1/2/2', a:'1/2/3/3', b:'2/1/3/2'},
  {name:'Reverse L', note:'Hero bottom-right against an upper band.', c:'1fr 1.3fr', r:'96px 150px', big:'2/2/3/3', a:'1/1/2/3', b:'2/1/3/2'},
  {name:'Golden split', note:'Columns at 1.618 to 1.', c:'1.618fr 1fr', r:'150px 96px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3'},
  {name:'Airy', note:'Watch classic with a 14px gutter.', c:'1.08fr 1fr', r:'150px 96px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3', gap:14},
  {name:'Tight', note:'Watch classic pulled to a 4px gutter.', c:'1.08fr 1fr', r:'150px 96px', big:'1/1/3/2', a:'1/2/2/3', b:'2/2/3/3', gap:4},
  {name:'Quarter rail', note:'Hero spans three of four columns.', c:'1fr 1fr 1fr 1fr', r:'124px 124px', big:'1/1/3/4', a:'1/4/2/5', b:'2/4/3/5'},
  {name:'Letterbox hero', note:'A short wide hero over tall supports.', c:'1fr 1fr', r:'104px 164px', big:'1/1/2/3', a:'2/1/3/2', b:'2/2/3/3'},
  {name:'Staircase', note:'Hero and one support share the top row.', c:'1.35fr 1fr', r:'146px 104px', big:'1/1/2/2', a:'1/2/2/3', b:'2/1/3/3'},
  {name:'Full-height right', note:'Hero runs the whole height on the right.', c:'1fr 1.25fr', r:'122px 122px', big:'1/2/3/3', a:'1/1/2/2', b:'2/1/3/2'},
  {name:'Split column', note:'Left column halved, hero fills the right.', c:'1fr 1.45fr', r:'134px 110px', big:'1/2/3/3', a:'1/1/2/2', b:'2/1/3/2'},
  {name:'Asymmetric three', note:'Uneven columns, hero across the first two.', c:'1.25fr .9fr .9fr', r:'140px 106px', big:'1/1/2/3', a:'1/3/3/4', b:'2/1/3/3'},
];
/* Swap the trio to see how each layout carries different subjects. */
const sets = [
  {label:'Knot + strap', photos:['knot-pink.jpg','tag-hero.jpg','clover-charm.jpg'],
   alts:['Pink knot keychain with a clover charm','Black strap with a magenta clover charm','Purple clover keyring charm']},
  {label:'Knot colourways', photos:['knot-pink.jpg','knot-lime.jpg','knot-lilac.jpg'],
   alts:['Pink knot keychain','Lime knot keychain','Lilac knot keychain']},
  {label:'Braid + knot', photos:['braid-tags.jpg','knot-green.jpg','knot-grey.jpg'],
   alts:['Braided paracord with clover tags','Green knot keychain','Knotted cords on a grey surface']},
];
let set = 0;
const main = document.querySelector('#grid');
function render() {
const {photos, alts} = sets[set];
main.replaceChildren(...layouts.map((l, i) => {
  const el = document.createElement('article');
  el.className = 'option';
  el.innerHTML = `
    <div class="stage"><div class="card"><div class="grid" style="grid-template-columns:${l.c};grid-template-rows:${l.r};gap:${l.gap ?? 8}px">
      <figure class="tile" style="grid-area:${l.big}"><img src="${P}${photos[0]}" alt="${alts[0]}" loading="lazy"></figure>
      <figure class="tile" style="grid-area:${l.a}"><img src="${P}${photos[1]}" alt="${alts[1]}" loading="lazy"></figure>
      <figure class="tile" style="grid-area:${l.b}"><img src="${P}${photos[2]}" alt="${alts[2]}" loading="lazy"></figure>
    </div></div></div>
    <div class="copy"><span class="n">${String(i + 1).padStart(2, '0')}</span><div><h2>${l.name}</h2><p class="note">${l.note}</p></div></div>`;
  return el;
}));
}
render();
const swap = document.querySelector('#swap');
function label(){ swap.textContent = `Photos: ${sets[set].label}`; }
label();
swap.addEventListener('click', () => { set = (set + 1) % sets.length; label(); render(); });
document.querySelectorAll('[data-choice]').forEach(b => b.addEventListener('click', () => {
  document.body.dataset.theme = b.dataset.choice;
  document.querySelectorAll('[data-choice]').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
}));
</script>
</body>
</html>
